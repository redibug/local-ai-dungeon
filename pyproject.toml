[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "local-ai-dungeon"
version = "0.1.0"
description = "Fully local AI dungeon crawler with swappable text/image model plugins"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
